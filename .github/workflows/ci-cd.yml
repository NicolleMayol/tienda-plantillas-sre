name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint, pruebas unitarias y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          STRIPE_SECRET_KEY: sk_test_placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  desplegar:
    name: Despliegue a Vercel (producción)
    needs: calidad
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: produccion
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - id: deploy
        run: echo "url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"
      # La URL propia de cada despliegue está protegida por Vercel Authentication;
      # el dominio de producción es público, así que la prueba de humo va contra él.
      - name: Prueba de humo
        env:
          URL_PRODUCCION: https://tienda-plantillas-sre.vercel.app
        run: |
          echo "Desplegado en ${{ steps.deploy.outputs.url }}"
          curl -fsS --retry 5 --retry-delay 5 "$URL_PRODUCCION/api/health"
          curl -fsS "$URL_PRODUCCION/" | grep -q "Plantillas"
